name: Build and push Docker image

on:
  push:
    branches: [ main ]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    name: Build SCS (auto mode)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set mode
        id: mode
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "mode=normal" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "mode=ultra" >> $GITHUB_OUTPUT
          else
            echo "mode=turbo" >> $GITHUB_OUTPUT
          fi
          echo "Mode selected: $(cat $GITHUB_OUTPUT)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #################################################################
      # MODE: ULTRA-TURBO (workflow_dispatch)
      #################################################################
      - name: Build & Push (ULTRA-TURBO)
        if: steps.mode.outputs.mode == 'ultra'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ibbylabs/scs:latest
            ghcr.io/ibbylabs/scs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #################################################################
      # MODE: TURBO (push on main)
      #################################################################
      - name: Build & Push (TURBO)
        if: steps.mode.outputs.mode == 'turbo'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ibbylabs/scs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #################################################################
      # MODE: NORMAL (release tags)
      #################################################################
      - name: Build & Push (NORMAL clean build)
        if: steps.mode.outputs.mode == 'normal'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ibbylabs/scs:${{ github.ref_name }}
          no-cache: true